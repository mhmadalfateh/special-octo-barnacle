name: Build Fateh Warehouse APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d extracted

          SETTINGS=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fateh-Warehouse-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
